ice</text><rect x="276" y="527" width="16" height="16" rx="4" fill="#4f46e5" stroke="#6366f1"/><text x="300" y="536" dominant-baseline="central" font-size="12.5" fill="#94a3b8">State</text><line x1="394" y1="536" x2="420" y2="536" stroke="#94a3b8" stroke-width="2.6"/><text x="428" y="536" dominant-baseline="central" font-size="12.5" fill="#94a3b8">request path</text><line x1="552" y1="536" x2="578" y2="536" stroke="#a5b4fc" stroke-width="2" stroke-dasharray="6 5"/><text x="586" y="536" dominant-baseline="central" font-size="12.5" fill="#94a3b8">background work</text><text x="40" y="588" font-size="12.5" fill="#94a3b8">Steps 1 to 4 complete without waiting on step 6, so a dead forward target never slows capture down.</text></svg>