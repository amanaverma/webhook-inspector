<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1020" width="1000" height="1020" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
<defs>
<marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,1 L9,5 L0,9 z" fill="#64748b"/></marker>
<marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,1 L9,5 L0,9 z" fill="#6366f1"/></marker>
</defs>
<rect width="1000" height="1020" fill="#ffffff"/><text x="40" y="44" font-size="11" font-weight="600" letter-spacing="1.4" fill="#64748b">WEBHOOK INSPECTOR</text><text x="40" y="70" font-size="19" font-weight="600" fill="#0f172a">What happens to one request</text><rect x="120" y="100" width="270" height="60" rx="10" fill="#0f766e" stroke="#0b5551" stroke-width="1.5"/><text x="255.0" y="130.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#ffffff" opacity="1">Request arrives</text><polygon points="255,196.0 385.0,240 255,284.0 125.0,240" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="255" y="231" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#e2e8f0">Slug known</text><text x="255" y="249" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#e2e8f0">and active?</text><polygon points="255,346.0 385.0,390 255,434.0 125.0,390" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="255" y="381" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#e2e8f0">Rate limit</text><text x="255" y="399" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#e2e8f0">token free?</text><polygon points="255,496.0 385.0,540 255,584.0 125.0,540" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="255" y="531" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#e2e8f0">Body within</text><text x="255" y="549" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#e2e8f0">1 MB?</text><rect x="120" y="640" width="270" height="70" rx="10" fill="#0f766e" stroke="#0b5551" stroke-width="1.5"/><text x="255.0" y="664.5" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#ffffff" opacity="1">Store raw bytes</text><text x="255.0" y="685.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#ffffff" opacity="0.85">headers, query, source IP</text><polygon points="255,776.0 385.0,820 255,864.0 125.0,820" fill="#1e293b" stroke="#475569" stroke-width="1.5"/><text x="255" y="811" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#e2e8f0">Forward URL</text><text x="255" y="829" text-anchor="middle" dominant-baseline="central" font-size="13.5" font-weight="600" fill="#e2e8f0">set?</text><rect x="120" y="920" width="270" height="66" rx="10" fill="#0f766e" stroke="#0b5551" stroke-width="1.5"/><text x="255.0" y="942.5" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#ffffff" opacity="1">Queued for delivery</text><text x="255.0" y="963.5" text-anchor="middle" dominant-baseline="central" font-size="12.5" font-weight="400" fill="#ffffff" opacity="0.85">5 attempts, backoff, dedupe</text><rect x="580" y="214" width="260" height="52" rx="10" fill="#be123c" stroke="#9f1239" stroke-width="1.5"/><text x="710.0" y="240.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#ffffff" opacity="1">404   nothing stored</text><rect x="580" y="364" width="260" height="52" rx="10" fill="#be123c" stroke="#9f1239" stroke-width="1.5"/><text x="710.0" y="390.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#ffffff" opacity="1">429   rate limited</text><rect x="580" y="514" width="260" height="52" rx="10" fill="#be123c" stroke="#9f1239" stroke-width="1.5"/><text x="710.0" y="540.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#ffffff" opacity="1">413   stored as truncated</text><rect x="580" y="649" width="260" height="52" rx="10" fill="#047857" stroke="#036049" stroke-width="1.5"/><text x="710.0" y="675.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#ffffff" opacity="1">Pushed to live tail</text><rect x="580" y="794" width="260" height="52" rx="10" fill="#047857" stroke="#036049" stroke-width="1.5"/><text x="710.0" y="820.0" text-anchor="middle" dominant-baseline="central" font-size="15" font-weight="600" fill="#ffffff" opacity="1">Ends here, visible in UI</text><path d="M385,240 H572" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="469.6" y="217" width="25.8" height="19" rx="4" fill="#ffffff"/><text x="482.5" y="227" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#334155">no</text><path d="M385,390 H572" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="469.6" y="367" width="25.8" height="19" rx="4" fill="#ffffff"/><text x="482.5" y="377" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#334155">no</text><path d="M385,540 H572" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="469.6" y="517" width="25.8" height="19" rx="4" fill="#ffffff"/><text x="482.5" y="527" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#334155">no</text><path d="M255,160 V196" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#a)"/><path d="M255,284 V346" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#a)"/><rect x="266" y="305.0" width="32.7" height="19" rx="4" fill="#ffffff"/><text x="272" y="315.0" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#334155">yes</text><path d="M255,434 V496" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#a)"/><rect x="266" y="455.0" width="32.7" height="19" rx="4" fill="#ffffff"/><text x="272" y="465.0" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#334155">yes</text><path d="M255,584 V636" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#a)"/><rect x="266" y="600.0" width="32.7" height="19" rx="4" fill="#ffffff"/><text x="272" y="610.0" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#334155">yes</text><path d="M390,675 H572" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><path d="M255,710 V776" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#a)"/><path d="M385,820 H572" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#a)"/><rect x="469.1" y="797" width="25.8" height="19" rx="4" fill="#ffffff"/><text x="482" y="807" text-anchor="middle" dominant-baseline="central" font-size="12.5" fill="#334155">no</text><path d="M255,864 V916" fill="none" stroke="#64748b" stroke-width="2.6" marker-end="url(#a)"/><rect x="266" y="880" width="32.7" height="19" rx="4" fill="#ffffff"/><text x="272" y="890" text-anchor="start" dominant-baseline="central" font-size="12.5" fill="#334155">yes</text><text x="40" y="998" font-size="12.5" fill="#64748b">Every rejection is answered before anything is stored. An oversized body is the exception: it is recorded as truncated.</text></svg>