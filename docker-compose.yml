services:
  postgres:
    image: postgres:16-alpine
    container_name: wi-postgres
    environment:
      POSTGRES_USER: wi
      POSTGRES_PASSWORD: wi
      POSTGRES_DB: webhook_inspector
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wi -d webhook_inspector"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: wi-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The application services. `docker compose --profile full up` runs the whole
  # stack; without the profile only Postgres and Redis start, which is what the
  # test suite and `npm run dev` need.
  migrate:
    profiles: ["full"]
    build: .
    command: ["node", "packages/db/dist/migrate.js"]
    environment:
      DATABASE_URL: postgres://wi:wi@postgres:5432/webhook_inspector
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: ["full"]
    build: .
    environment: &app_env
      NODE_ENV: development
      DATABASE_URL: postgres://wi:wi@postgres:5432/webhook_inspector
      REDIS_URL: redis://redis:6379
      FORWARD_ALLOW_PRIVATE: "true"
      RETENTION_DAYS: 7
    ports:
      - "3000:3000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    profiles: ["full"]
    build: .
    command: ["node", "apps/api/dist/worker-main.js"]
    environment: *app_env
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: ["full"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        API_BASE_URL: http://api:3000
    environment:
      # Rewrites bake this in at build time, but server components read it at
      # run time, so it has to be set in both places.
      API_BASE_URL: http://api:3000
      CAPTURE_ORIGIN: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      - api

volumes:
  pgdata:
